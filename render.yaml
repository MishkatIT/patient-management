databases:
  - name: patient-management-db
    plan: free

services:
  - type: web
    name: patient-management-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py collectstatic --no-input && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/patients/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patient-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://patient-management-frontend-h6yb.onrender.com

  - type: web
    name: patient-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: patient-management-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME